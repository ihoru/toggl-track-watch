[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[project]
name = "trackwatch-push"
version = "0.1.0"
description = "Forwards Toggl Track webhook events to the Track Watch phone app through Firebase Cloud Messaging"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "aiohttp>=3.10,<4",
  "google-auth>=2.30,<3",
  "requests>=2.32,<3",
]

[project.scripts]
trackwatch-push = "trackwatch_push.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-aiohttp>=1.0,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
