name: Release

# Publishes the version in pubspec.yaml: a GitHub Release with signed APKs and, when
# PLAY_SERVICE_ACCOUNT_JSON is set, the app bundles on Google Play. Start it from Actions → Release →
# Run workflow on main (it creates the tag v<version>), or push a tag like v1.4.0 yourself.
# See docs/PUBLISHING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7

      - name: Version from pubspec (and check the tag)
        run: |
          FULL=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          PUBSPEC=${FULL%%+*}
          BUILD=${FULL##*+}
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="${GITHUB_REF_NAME#v}"
            echo "Tag $TAG, pubspec $PUBSPEC"
            if [ "$TAG" != "$PUBSPEC" ]; then
              echo "::error::Tag v$TAG doesn't match pubspec.yaml version $PUBSPEC"; exit 1
            fi
          elif [ "$GITHUB_REF_NAME" != main ]; then
            echo "::error::Run the release from main (this run is on $GITHUB_REF_NAME)."; exit 1
          elif git ls-remote --exit-code --tags origin "refs/tags/v$PUBSPEC" > /dev/null; then
            echo "::error::v$PUBSPEC is already released. Bump version: in pubspec.yaml first."; exit 1
          fi
          echo "VERSION=$PUBSPEC" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [$VERSION]"; exit 1
          fi
          cat notes.md

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TRACKWATCH_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TRACKWATCH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRACKWATCH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TRACKWATCH_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Tolerate line breaks and spaces added when pasting the secrets.
            KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
            KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d ' \r\n\t')
            KEY_PASSWORD=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')
            CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t')
            echo "Keystore secret: ${#CLEAN} base64 characters (expected 5676)."
            if ! printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/trackwatch.jks"; then
              echo "::error::TRACKWATCH_KEYSTORE_BASE64 is not valid base64 (probably cut off while pasting)."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/trackwatch.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null; then
              echo "::error::The keystore could not be opened with TRACKWATCH_KEYSTORE_PASSWORD / TRACKWATCH_KEY_ALIAS."
              exit 1
            fi
            keytool -list -v -keystore "$RUNNER_TEMP/trackwatch.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep 'SHA256:'
            {
              echo "TRACKWATCH_KEYSTORE=$RUNNER_TEMP/trackwatch.jks"
              echo "TRACKWATCH_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "TRACKWATCH_KEY_ALIAS=$KEY_ALIAS"
              echo "TRACKWATCH_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::error::Releases must be signed: set the TRACKWATCH_KEYSTORE_* secrets."; exit 1
          fi

      - name: Build APKs (arm64) and app bundles
        run: |
          for f in phone wear; do
            flutter build apk --release --flavor $f -t lib/main_$f.dart \
              --split-per-abi --target-platform android-arm64 --split-debug-info=build/symbols/$f
            flutter build appbundle --release --flavor $f -t lib/main_$f.dart \
              --split-debug-info=build/symbols/$f-bundle
          done
          mkdir -p dist bundles
          for f in phone wear; do
            cp build/app/outputs/flutter-apk/app-arm64-v8a-$f-release.apk "dist/track-watch-$f-$VERSION.apk"
            cp build/app/outputs/bundle/${f}Release/app-$f-release.aab "bundles/track-watch-$f-$VERSION.aab"
          done
          ls -lh dist bundles

      # On a manual run this also creates the tag v<version> on the commit that was built.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Track Watch ${{ env.VERSION }}
          body_path: notes.md
          files: dist/*.apk

      # For the first manual Play upload (see docs/PUBLISHING.md) and for reference.
      - uses: actions/upload-artifact@v7
        with:
          name: play-bundles-${{ env.VERSION }}
          path: bundles/*.aab

      # Play's "What's new" text: fastlane/metadata/android/en-US/changelogs/<versionCode>.txt.
      - name: Play release notes
        if: env.PLAY_JSON != ''
        run: |
          for pair in phone:$((BUILD * 10)) wear:$((BUILD * 10 + 1)); do
            f=${pair%%:*}; code=${pair##*:}
            src=fastlane/metadata/android/en-US/changelogs/$code.txt
            [ -f "$src" ] || { echo "::error::Missing $src"; exit 1; }
            [ "$(wc -m < "$src")" -le 500 ] || { echo "::error::$src is longer than Play's 500 characters"; exit 1; }
            mkdir -p "whatsnew/$f" && cp "$src" "whatsnew/$f/whatsnew-en-US"
          done

      # Until the app has passed its first Play review, Play only accepts draft releases; set the
      # repository variable PLAY_RELEASE_STATUS to "completed" afterwards. PLAY_TRACK picks the track
      # (internal by default; alpha, beta or production); the watch uses the Wear OS track of that name.
      - name: Upload phone bundle to Google Play
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: su.iho.trackwatch
          releaseFiles: bundles/track-watch-phone-${{ env.VERSION }}.aab
          whatsNewDirectory: whatsnew/phone
          tracks: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

      - name: Upload watch bundle to Google Play (Wear OS track)
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: su.iho.trackwatch
          releaseFiles: bundles/track-watch-wear-${{ env.VERSION }}.aab
          whatsNewDirectory: whatsnew/wear
          tracks: wear:${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
