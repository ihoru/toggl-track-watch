name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

      # Both APKs must be signed with the same key for the watch and phone apps
      # to talk to each other. Set the TRACKWATCH_KEYSTORE_BASE64,
      # TRACKWATCH_KEYSTORE_PASSWORD, TRACKWATCH_KEY_ALIAS and
      # TRACKWATCH_KEY_PASSWORD secrets to use a stable key; without them the
      # runner's debug key is used (same key for both APKs of one run, but it
      # changes between runs).
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TRACKWATCH_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TRACKWATCH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRACKWATCH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TRACKWATCH_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Tolerate line breaks and spaces added when pasting the secrets.
            KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
            KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d ' \r\n\t')
            KEY_PASSWORD=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')
            CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t')
            echo "Keystore secret: ${#CLEAN} base64 characters (expected 5676)."
            if ! printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/trackwatch.jks"; then
              echo "::error::TRACKWATCH_KEYSTORE_BASE64 is not valid base64 (probably cut off while pasting)."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/trackwatch.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null; then
              echo "::error::The keystore could not be opened with TRACKWATCH_KEYSTORE_PASSWORD / TRACKWATCH_KEY_ALIAS."
              exit 1
            fi
            keytool -list -v -keystore "$RUNNER_TEMP/trackwatch.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep 'SHA256:'
            {
              echo "TRACKWATCH_KEYSTORE=$RUNNER_TEMP/trackwatch.jks"
              echo "TRACKWATCH_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "TRACKWATCH_KEY_ALIAS=$KEY_ALIAS"
              echo "TRACKWATCH_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "No signing secrets; using the runner's debug key."
          fi

      # One APK per CPU type instead of one "fat" APK with all of them: the Pixel phone and
      # watch only need arm64; x86_64 is built for the emulator smoke tests.
      - name: Build phone APKs
        run: >-
          flutter build apk --release --flavor phone -t lib/main_phone.dart
          --split-per-abi --target-platform android-arm64,android-x64
          --split-debug-info=build/symbols/phone
      - name: Build watch APKs
        run: >-
          flutter build apk --release --flavor wear -t lib/main_wear.dart
          --split-per-abi --target-platform android-arm64,android-x64
          --split-debug-info=build/symbols/wear

      - name: Collect APKs
        run: |
          ls -l build/app/outputs/flutter-apk/
          mkdir -p dist smoke
          for f in phone wear; do
            cp build/app/outputs/flutter-apk/app-arm64-v8a-$f-release.apk "dist/track-watch-$f.apk"
            cp build/app/outputs/flutter-apk/app-x86_64-$f-release.apk "smoke/app-$f-release.apk"
          done
          ls -lh dist

      - name: Check both APKs have the same signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          for f in phone wear; do
            "$APKSIGNER" verify --print-certs "dist/track-watch-$f.apk" | grep 'SHA-256' | tee "sig-$f.txt"
          done
          diff sig-phone.txt sig-wear.txt

      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testPhoneDebugUnitTest

      - uses: actions/upload-artifact@v7
        with:
          name: track-watch-apks
          path: dist/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: smoke-test-apks
          path: smoke/*.apk
          retention-days: 3

  # Launches each APK in an emulator and captures crashes, logs and a screenshot.
  smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone
            target: google_apis
            api: 34
          - name: wear
            target: android-wear
            api: 33
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: smoke-test-apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch ${{ matrix.name }} app in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app-${{ matrix.name }}-release.apk
            adb logcat -c
            adb shell am start -W -n su.iho.trackwatch/.MainActivity
            sleep 25
            adb exec-out screencap -p > screen.png
            adb logcat -d -b crash > crash.txt
            adb logcat -d > logcat.txt
            (adb shell pidof su.iho.trackwatch && echo RUNNING) > status.txt || echo "NOT RUNNING" > status.txt
            adb shell dumpsys window windows | grep -A40 "su.iho.trackwatch/su.iho.trackwatch.MainActivity" | grep -o "KEEP_SCREEN_ON" | head -1 > screen-flags.txt || true
            echo "Keep-screen-on flags: $(cat screen-flags.txt)"
            cat status.txt
            cat crash.txt
            grep -E "AndroidRuntime|flutter|trackwatch|FATAL" logcat.txt | tail -150 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test-${{ matrix.name }}
          path: |
            screen.png
            crash.txt
            logcat.txt
            status.txt
            screen-flags.txt

      - name: Fail on crash
        run: |
          if [ -s crash.txt ] || grep -q "NOT RUNNING" status.txt; then
            echo "The ${{ matrix.name }} app crashed or is not running"; exit 1
          fi
          if [ -s screen-flags.txt ]; then
            echo "The ${{ matrix.name }} app keeps the screen on"; exit 1
          fi
