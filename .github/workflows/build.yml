name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

      # Both APKs must be signed with the same key for the watch and phone apps
      # to talk to each other. Set the TRACKWATCH_KEYSTORE_BASE64,
      # TRACKWATCH_KEYSTORE_PASSWORD, TRACKWATCH_KEY_ALIAS and
      # TRACKWATCH_KEY_PASSWORD secrets to use a stable key; without them the
      # runner's debug key is used (same key for both APKs of one run, but it
      # changes between runs).
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TRACKWATCH_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TRACKWATCH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRACKWATCH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TRACKWATCH_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/trackwatch.jks"
            {
              echo "TRACKWATCH_KEYSTORE=$RUNNER_TEMP/trackwatch.jks"
              echo "TRACKWATCH_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "TRACKWATCH_KEY_ALIAS=$KEY_ALIAS"
              echo "TRACKWATCH_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "No signing secrets; using the runner's debug key."
          fi

      - name: Build phone APK
        run: flutter build apk --release --flavor phone -t lib/main_phone.dart
      - name: Build watch APK
        run: flutter build apk --release --flavor wear -t lib/main_wear.dart

      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testPhoneReleaseUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: track-watch-apks
          path: |
            build/app/outputs/flutter-apk/app-phone-release.apk
            build/app/outputs/flutter-apk/app-wear-release.apk
