org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Keep the pubspec build number as versionCode for per-ABI APKs (no +1000*ABI offset),
# so phone and watch show the same build number and updates install over each other.
force-version-code-ignoring-abi=true
# Flutter's Gradle plugin (3.47) still uses AGP's legacy variant API, which needs the old DSL.
# Remove once Flutter supports AGP's new DSL. Kotlin uses AGP's built-in Kotlin support.
android.newDsl=false
